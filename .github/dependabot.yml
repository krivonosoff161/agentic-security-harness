version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-development:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # aiohttp 3.14.3 requires multidict <7. Review this cap with aiohttp upgrades.
      - dependency-name: "multidict"
        versions:
          - ">=7"
    labels:
      - "dependencies"
      - "python"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      codeql-family:
        patterns:
          - "github/codeql-action/*"
    labels:
      - "dependencies"
      - "github-actions"
