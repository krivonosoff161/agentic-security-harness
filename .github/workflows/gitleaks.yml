name: Secret scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

      - name: Verify the pinned scanner binary
        shell: bash
        run: |
          set -euo pipefail
          gitleaks_path="$(command -v gitleaks)"
          test "$(gitleaks version)" = "8.30.1"
          printf '%s  %s\n' \
            '88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509' \
            "$gitleaks_path" | sha256sum --check --strict -

      - name: Verify exact suppressions do not hide a fresh synthetic finding
        run: python3 tools/check_gitleaks_regression.py --gitleaks gitleaks
