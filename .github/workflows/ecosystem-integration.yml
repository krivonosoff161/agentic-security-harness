name: Ecosystem integration candidate

on:
  pull_request:
    paths:
      - ".github/workflows/ecosystem-integration.yml"
      - "component.yaml"
      - "ecosystem/**"
      - "schemas/**"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "docs/**"
      - "requirements/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-source-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out Harness candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact Transfer extension source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: krivonosoff161/agentic-transfer-verifier
          ref: b6ec73b552eddd582a17794d1ce167b611b9aa28
          path: components/transfer
          persist-credentials: false

      - name: Check out exact Handoff extension source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: krivonosoff161/ai-agent-handoff
          ref: 796898733ccb157519b818e2c36b5769be2a030b
          path: components/handoff
          persist-credentials: false

      - name: Check out exact Policy Pack source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: krivonosoff161/llm-safety-playbooks
          ref: ffaec98d85a8cd0b7d728375b24501f292d9e822
          path: components/playbooks
          persist-credentials: false

      - name: Check out exact Router source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: krivonosoff161/llm-router
          ref: f17aca58b7b5b624d0e4d16949a14eab714bb998
          path: components/router
          persist-credentials: false

      - name: Check out exact Cheap Filter source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: krivonosoff161/llm-cheap-filter
          ref: c5f8b7dd8f85782dae80418e8aad0d0a8debe1dd
          path: components/filter
          persist-credentials: false

      - name: Check out exact profile projection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: krivonosoff161/krivonosoff161
          ref: ccb34ef951f434db8220b75bdf1129c3d0f97fda
          path: components/profile
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked development and build dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --require-hashes -r requirements/build.txt

      - name: Validate generated schemas manifests and documentation
        run: |
          python tools/ecosystem_docs.py check
          python tools/extension_contracts.py check
          python tools/extension_distribution_contracts.py check
          python tools/extension_lifecycle_contracts.py check
          python tools/companion_extension_contracts.py check
          python tools/security_intelligence_contracts.py check
          python tools/receipt_auditor_contracts.py check
          python tools/corpus_pack_contracts.py check
          python tools/controlled_local_adapter_contracts.py check
          python tools/policy_pack_extension_contracts.py check

      - name: Validate exact central component lock
        run: >-
          python tools/ecosystem_docs.py check-lock
          --component-root .
          --component-root components/transfer
          --component-root components/handoff
          --component-root components/playbooks
          --component-root components/router
          --component-root components/filter
          --component-root components/profile

      - name: Build install and run exact extension lifecycle plus product contours
        env:
          ASH_TRANSFER_ROOT: ${{ github.workspace }}/components/transfer
          ASH_HANDOFF_ROOT: ${{ github.workspace }}/components/handoff
          ASH_PLAYBOOKS_ROOT: ${{ github.workspace }}/components/playbooks
          ASH_POLICY_PACK_ROOT: ${{ github.workspace }}/components/playbooks
          ASH_ROUTER_ROOT: ${{ github.workspace }}/components/router
          ASH_FILTER_ROOT: ${{ github.workspace }}/components/filter
          GIT_OPTIONAL_LOCKS: "0"
        run: >-
          python -m pytest -q
          tests/test_ecosystem_integration_candidate.py
          tests/test_companion_extensions.py
          tests/test_cross_repo_extension_compatibility.py
          tests/test_receipt_auditors.py
          tests/test_cross_repo_receipt_compatibility.py
          tests/test_corpus_packs.py
          tests/test_policy_pack_extension.py
          tests/test_cross_repo_policy_pack_compatibility.py
          tests/test_controlled_local_adapter.py
          tests/test_ecosystem_docs.py
          tests/test_documentation_contract.py
          tests/test_security_portfolio_roadmap_contract.py

      - name: Run full test and static analysis gates
        run: |
          python -m pytest -q
          python -m ruff check . --exclude components
          python -m mypy src tests tools
          python -m bandit -q -ll -r src

      - name: Build exact optional-module wheelhouse
        run: |
          python -m build --no-isolation --wheel --outdir wheelhouse .
          python -m build --no-isolation --wheel --outdir wheelhouse components/transfer
          python -m build --no-isolation --wheel --outdir wheelhouse components/transfer/extensions/transfer_harness_extension_v1
          python -m build --no-isolation --wheel --outdir wheelhouse components/handoff
          python -m build --no-isolation --wheel --outdir wheelhouse components/handoff/extensions/harness-v1
          python -m build --no-isolation --wheel --outdir wheelhouse components/playbooks
          python -m build --no-isolation --wheel --outdir wheelhouse components/router
          python -m build --no-isolation --wheel --outdir wheelhouse components/filter
          python tools/optional_wheelhouse_smoke.py wheelhouse

      - name: Build and smoke the Harness package
        run: |
          python -m build --no-isolation --wheel --outdir dist
          python -m pip install --no-index --no-deps --force-reinstall dist/agentic_security_harness-1.3.0-py3-none-any.whl
          ash --help
