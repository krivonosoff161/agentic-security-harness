name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        # Back the cross-platform claim with one Windows job (kept lightweight).
        include:
          - os: windows-latest
            python-version: "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check whitespace and conflict markers
        run: git diff --check

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install locked dev dependencies
        run: python -m pip install --require-hashes -r requirements/dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Run ruff
        run: python -m ruff check .

      - name: Run mypy
        run: python -m mypy src tests tools

      - name: Validate committed benchmark artifacts
        run: python -m agentic_security_harness.cli validate examples/

  package:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked build dependencies
        run: python -m pip install --require-hashes -r requirements/build.txt

      - name: Build sdist and wheel
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          for output in dist reproducibility-check; do
            python -m build --no-isolation --outdir "$output"
            python tools/normalize_sdist.py "$output"/*.tar.gz --epoch "$SOURCE_DATE_EPOCH"
          done
          cmp dist/*.tar.gz reproducibility-check/*.tar.gz
          cmp dist/*.whl reproducibility-check/*.whl
          rm -rf reproducibility-check

      - name: Smoke installed wheel
        run: |
          python -m pip install --require-hashes -r requirements/runtime.txt
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -c "import importlib.resources as r; import agentic_security_harness as ash; assert r.files('agentic_security_harness').joinpath('py.typed').is_file(); print(ash.__version__)"
          ash --help
          ash validate examples/

  linux-installed-quickstart:
    name: Linux installed quickstart / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Build and install wheel
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/build.txt
          python -m pip install --require-hashes -r requirements/runtime.txt
          python -m build --no-isolation --wheel --outdir dist
          python -m pip install --no-deps --force-reinstall dist/*.whl

      - name: Run first-user pipeline outside the source checkout
        run: |
          set -euo pipefail
          user_dir="$(mktemp -d)"
          cd "$user_dir"
          ash quickstart --out result
          test -f result/run_index.json
          test -f result/report.html
          ash validate result
          ash agent-host-quickstart --out agent-host-result
          test -f agent-host-result/run_index.json
          test -f agent-host-result/agent_host_summary.json
          ash validate agent-host-result
          ash gateway-init --out gateway.toml
          ash gateway-check --config gateway.toml
          test ! -e .internal/runtime-gateway

  runtime-gateway-container:
    name: Runtime Gateway container smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate and build synthetic gateway image
        run: |
          set -euo pipefail
          docker compose -f compose.gateway.yml config --quiet
          docker build --file Dockerfile.gateway --tag ash-runtime-gateway:ci .

      - name: Exercise loopback-only health and MCP discovery
        run: |
          set -euo pipefail
          docker volume create ash-gateway-ci-audit >/dev/null
          fixture_output="$(docker run --rm \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:size=16m --volume ash-gateway-ci-audit:/data \
            --entrypoint ash ash-runtime-gateway:ci \
            gateway-fixture --config /app/gateway.toml \
            --provider openai_responses \
            --input /app/provider-fixtures/openai-responses.json)"
          printf '%s' "$fixture_output" | grep --fixed-strings \
            'allow=1 deny=0 require_approval=0' >/dev/null
          printf '%s' "$fixture_output" | grep --fixed-strings \
            'Provider/network/credentials: off' >/dev/null
          docker run --detach --name ash-gateway-ci \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:size=16m --volume ash-gateway-ci-audit:/data \
            --publish 127.0.0.1:8787:8787 ash-runtime-gateway:ci
          cleanup() {
            docker rm --force ash-gateway-ci >/dev/null 2>&1 || true
            docker volume rm ash-gateway-ci-audit >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs ash-gateway-ci
              exit 1
            fi
            sleep 1
          done
          response="$(curl --fail --silent http://127.0.0.1:8787/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: server/discover' \
            --data '{"jsonrpc":"2.0","id":"ci","method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"ash-ci","version":"1.0.0"},"io.modelcontextprotocol/clientCapabilities":{}}}}')"
          printf '%s' "$response" | grep --fixed-strings '"supportedVersions":["2026-07-28"]' >/dev/null
          printf '%s' "$response" | grep --fixed-strings '"resultType":"complete"' >/dev/null
