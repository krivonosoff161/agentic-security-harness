name: Ecosystem documentation contracts

on:
  pull_request:
    paths:
      - ".github/workflows/ecosystem-docs.yml"
      - "component.yaml"
      - "ecosystem/**"
      - "docs/**"
      - "schemas/**"
      - "tools/ecosystem_docs.py"
      - "tools/extension_contracts.py"
      - "tools/extension_distribution_contracts.py"
      - "tools/extension_lifecycle_contracts.py"
      - "tools/companion_extension_contracts.py"
      - "tools/security_intelligence_contracts.py"
      - "tools/receipt_auditor_contracts.py"
      - "tools/corpus_pack_contracts.py"
      - "tools/controlled_local_adapter_contracts.py"
      - "tools/policy_pack_extension_contracts.py"
      - "tests/test_ecosystem_docs.py"
      - "src/agentic_security_harness/extension_sdk.py"
      - "src/agentic_security_harness/extension_distribution.py"
      - "src/agentic_security_harness/extension_lifecycle.py"
      - "src/agentic_security_harness/__init__.py"
      - "src/agentic_security_harness/cli.py"
      - "src/agentic_security_harness/companion_extensions.py"
      - "src/agentic_security_harness/security_intelligence.py"
      - "src/agentic_security_harness/receipt_auditors.py"
      - "src/agentic_security_harness/corpus_packs.py"
      - "src/agentic_security_harness/controlled_local_adapter.py"
      - "src/agentic_security_harness/__init__.py"
      - "src/agentic_security_harness/provider_tool_adapters.py"
      - "src/agentic_security_harness/runtime_gateway.py"
      - "src/agentic_security_harness/policy_pack_extension.py"
      - "src/agentic_security_harness/cli.py"
      - "tests/test_extension_sdk.py"
      - "tests/test_extension_distribution.py"
      - "tests/test_extension_lifecycle.py"
      - "tests/test_companion_extensions.py"
      - "tests/test_security_intelligence.py"
      - "tests/test_cross_repo_extension_compatibility.py"
      - "tests/test_receipt_auditors.py"
      - "tests/test_cross_repo_receipt_compatibility.py"
      - "tests/test_corpus_packs.py"
      - "tests/test_controlled_local_adapter.py"
      - "tests/test_policy_pack_extension.py"
      - "tests/test_cli_authority.py"
      - "tests/test_cross_repo_policy_pack_compatibility.py"
      - "README.md"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ecosystem-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out Harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out Transfer Verifier contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: krivonosoff161/agentic-transfer-verifier
          ref: 02a9f963f71804f18077ae560ac00f82ec55602d
          path: components/transfer
          persist-credentials: false

      - name: Check out Handoff contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: krivonosoff161/ai-agent-handoff
          ref: ae60003c4a681f6de11416d935e865f1c1c56557
          path: components/handoff
          persist-credentials: false

      - name: Check out Playbooks contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: krivonosoff161/llm-safety-playbooks
          ref: 3e6795a4671cc6417bc04aad17163238a8b01ddc
          path: components/playbooks
          persist-credentials: false

      - name: Check out Policy Pack V1 contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: krivonosoff161/llm-safety-playbooks
          ref: 3e6795a4671cc6417bc04aad17163238a8b01ddc
          path: components/playbooks-policy-pack-v1
          persist-credentials: false

      - name: Check out Router contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: krivonosoff161/llm-router
          ref: 463f8472b50e4b20c01366b3f5355a2e8f6cdac2
          path: components/router
          persist-credentials: false

      - name: Check out Filter contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: krivonosoff161/llm-cheap-filter
          ref: cf8161cecf82276162cedb9f46cc454fe6c08d32
          path: components/filter
          persist-credentials: false

      - name: Check out Profile projection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: krivonosoff161/krivonosoff161
          ref: ccb34ef951f434db8220b75bdf1129c3d0f97fda
          path: components/profile
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked test dependencies
        run: python -m pip install --require-hashes -r requirements/dev.txt

      - name: Validate generated contracts
        run: |
          python tools/ecosystem_docs.py check
          python tools/extension_contracts.py check
          python tools/extension_distribution_contracts.py check
          python tools/extension_lifecycle_contracts.py check
          python tools/companion_extension_contracts.py check
          python tools/security_intelligence_contracts.py check
          python tools/receipt_auditor_contracts.py check
          python tools/corpus_pack_contracts.py check
          python tools/controlled_local_adapter_contracts.py check
          python tools/policy_pack_extension_contracts.py check

      - name: Validate exact component lock
        run: >-
          python tools/ecosystem_docs.py check-lock
          --component-root .
          --component-root components/transfer
          --component-root components/handoff
          --component-root components/playbooks
          --component-root components/router
          --component-root components/filter
          --component-root components/profile

      - name: Run documentation contract tests
        run: >-
          python -m pytest -q
          tests/test_ecosystem_docs.py
          tests/test_documentation_contract.py
          tests/test_security_portfolio_roadmap_contract.py

      - name: Run exact companion Extension SDK compatibility
        env:
          ASH_TRANSFER_ROOT: ${{ github.workspace }}/components/transfer
          ASH_HANDOFF_ROOT: ${{ github.workspace }}/components/handoff
          ASH_PLAYBOOKS_ROOT: ${{ github.workspace }}/components/playbooks
          ASH_ROUTER_ROOT: ${{ github.workspace }}/components/router
          ASH_FILTER_ROOT: ${{ github.workspace }}/components/filter
          ASH_POLICY_PACK_ROOT: ${{ github.workspace }}/components/playbooks-policy-pack-v1
          GIT_OPTIONAL_LOCKS: "0"
        run: >-
          python -m pytest -q
          tests/test_extension_sdk.py
          tests/test_extension_distribution.py
          tests/test_extension_lifecycle.py
          tests/test_companion_extensions.py
          tests/test_security_intelligence.py
          tests/test_cross_repo_extension_compatibility.py
          tests/test_receipt_auditors.py
          tests/test_cross_repo_receipt_compatibility.py
          tests/test_corpus_packs.py
          tests/test_controlled_local_adapter.py
          tests/test_policy_pack_extension.py
          tests/test_cli_authority.py
          tests/test_cross_repo_policy_pack_compatibility.py

  windows-stable-read:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: windows-latest
    steps:
      - name: Check out Harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install locked test dependencies
        run: python -m pip install --require-hashes -r requirements/dev.txt

      - name: Run distribution stable-read regressions
        run: >-
          python -m pytest -q
          tests/test_extension_distribution.py
