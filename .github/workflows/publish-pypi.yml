name: Publish verified package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact canonical tag built by release.yml (for example v1.0.0)
        required: true
        type: string
      release_run_id:
        description: Successful tag-triggered Release artifacts workflow run id
        required: true
        type: string
      target:
        description: Package index promotion target
        required: true
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: package-publish-${{ inputs.release_tag }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exact attested subjects to ${{ inputs.target }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target }}
    permissions:
      actions: read
      attestations: read
      contents: read
      id-token: write
    steps:
      - name: Check out exact selected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify selected tag and successful source workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          run_json="$RUNNER_TEMP/release-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" > "$run_json"
          python - "$run_json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          run = json.loads(Path(sys.argv[1]).read_text("utf-8"))
          expected = {
              "conclusion": "success",
              "event": "push",
              "head_sha": os.environ["GITHUB_SHA"],
              "head_branch": os.environ["RELEASE_TAG"],
              "path": ".github/workflows/release.yml",
              "status": "completed",
          }
          observed = {key: run.get(key) for key in expected}
          if observed != expected:
              raise SystemExit(
                  f"release workflow identity mismatch: expected={expected!r}, observed={observed!r}"
              )
          PY

      - name: Download exact release subjects
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_run_id }}
          name: release-dist-${{ inputs.release_tag }}
          path: dist

      - name: Verify checksums and release attestations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          cd ..
          for artifact in dist/*.tar.gz dist/*.whl dist/*.cdx.json dist/SHA256SUMS; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --source-digest "$GITHUB_SHA" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
              --predicate-type "https://slsa.dev/provenance/v1" \
              --deny-self-hosted-runners
          done
          mkdir publish-dist
          cp dist/*.tar.gz dist/*.whl publish-dist/

      - name: Verify TestPyPI subjects before production promotion
        if: inputs.target == 'pypi'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          url = f"https://test.pypi.org/pypi/agentic-security-harness/{version}/json"
          with urllib.request.urlopen(url, timeout=30) as response:
              payload = json.load(response)
          expected = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in sorted(Path("publish-dist").iterdir())
          }
          observed = {
              item["filename"]: item["digests"]["sha256"]
              for item in payload.get("urls", [])
              if item.get("packagetype") in {"bdist_wheel", "sdist"}
          }
          if observed != expected:
              raise SystemExit(
                  f"TestPyPI subject mismatch: expected={sorted(expected)}, observed={sorted(observed)}"
              )
          PY

      - name: Publish to TestPyPI with OIDC
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish-dist/
          repository-url: https://test.pypi.org/legacy/
          verbose: false

      - name: Publish to PyPI with OIDC
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish-dist/
          verbose: false

      - name: Verify published package-index subjects
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_INDEX: ${{ inputs.target }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          host = "test.pypi.org" if os.environ["TARGET_INDEX"] == "testpypi" else "pypi.org"
          url = f"https://{host}/pypi/agentic-security-harness/{version}/json"
          expected = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in sorted(Path("publish-dist").iterdir())
          }
          observed = None
          for attempt in range(1, 6):
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      payload = json.load(response)
                  observed = {
                      item["filename"]: item["digests"]["sha256"]
                      for item in payload.get("urls", [])
                      if item.get("packagetype") in {"bdist_wheel", "sdist"}
                  }
                  if observed == expected:
                      break
              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      raise
              if attempt < 5:
                  time.sleep(15)
          if observed != expected:
              raise SystemExit(
                  f"published subject mismatch: expected={sorted(expected)}, "
                  f"observed={sorted(observed or {})}"
              )
          PY

  smoke-testpypi:
    name: Smoke TestPyPI package
    if: inputs.target == 'testpypi'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install and validate exact TestPyPI version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for attempt in 1 2 3 4 5; do
            if python -m pip install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "agentic-security-harness==$version"; then
              break
            fi
            test "$attempt" -lt 5
            sleep 15
          done
          ash --help
          ash quickstart --out "$RUNNER_TEMP/quickstart"
          ash validate "$RUNNER_TEMP/quickstart"

  smoke-pypi:
    name: Smoke PyPI (${{ matrix.os }}, Python ${{ matrix.python }})
    if: inputs.target == 'pypi'
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact PyPI version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          python -m pip install "agentic-security-harness==$version"
          ash --help
          ash quickstart --out "$RUNNER_TEMP/quickstart"
          ash validate "$RUNNER_TEMP/quickstart"
