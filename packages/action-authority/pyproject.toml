[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ash-action-authority-candidate"
version = "0.1.0.dev0"
description = "Experimental exact-action approval component over Agentic Security Harness"
readme = {file = "README.txt", content-type = "text/plain"}
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["agentic-security-harness==1.14.1", "cryptography==50.0.2"]

[tool.setuptools.packages.find]
where = ["src"]
